# Import this whole file in CasaOS/ZimaOS Custom Install after copying the
# contents of the RepostBot release folder to /ZimaOS-HD/ChatBot in Files.
# ZimaOS exposes that location to Docker as /DATA/ChatBot.
name: repostbot
services:
  repostbot:
    init: true
    shm_size: 512m
    stop_grace_period: 30s
    image: python:3.12-slim
    command: ["sh", "/app/start_container.sh"]
    restart: on-failure
    environment:
      WEB_HOST: 0.0.0.0
      WEB_PORT: "8787"
      DATA_DIR: /app/data
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: qwen3:4b
      PYTHONUNBUFFERED: "1"
      REPOSTBOT_INSTALL_BROWSER: "1"
    ports:
      - target: 8787
        published: "8787"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/ChatBot
        target: /app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      ollama:
        condition: service_healthy
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_CONTEXT_LENGTH: "2048"
      OLLAMA_KEEP_ALIVE: "5m"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
  ollama-model:
    image: ollama/ollama:latest
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: qwen3:4b
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull \"$${OLLAMA_MODEL}\""]
volumes:
  ollama_data:
x-casaos:
  id: io.repostbot.repostbot
  main: repostbot
  index: /
  port_map: "8787"
  scheme: http
  icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons@main/png/telegram.png
  title:
    en_US: RepostBot
    ru_RU: RepostBot
  tagline:
    en_US: VK to Telegram reposting and bot controls
    ru_RU: Репосты VK в Telegram и управление ботом
  description:
    en_US: Local VK and Telegram route manager with a web interface.
    ru_RU: Локальная панель маршрутов VK и Telegram.
  author: RepostBot
  developer: RepostBot
  category: Productivity
  architectures: [amd64, arm64]
  version: "1.3.220"
